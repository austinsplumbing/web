<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Fonts -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@900&display=swap');
      .text-ring { font-family: 'Roboto Slab', serif; font-weight: 900; letter-spacing: 2px; }
      .brand-name { font-family: 'Roboto Slab', serif; font-weight: 900; }
    </style>
    <!-- Paths for Text -->
    <path id="text-curve-top" d="M 40,150 A 110,110 0 0,1 260,150" fill="none" />
    <path id="text-curve-bottom" d="M 45,150 A 105,105 0 0,0 255,150" fill="none" />
  </defs>

  <!-- Background Circle (Navy) -->
  <circle cx="150" cy="150" r="145" fill="#0B2545" stroke="#E03E2F" stroke-width="8" />
  
  <!-- Inner Ring (Thin Orange) -->
  <circle cx="150" cy="150" r="115" fill="none" stroke="#E03E2F" stroke-width="2" />

  <!-- Curved Text (Top) -->
  <text fill="#FFFDD0" font-size="24" class="text-ring">
    <textPath href="#text-curve-top" startOffset="50%" text-anchor="middle">
      LICENSED &amp; INSURED
    </textPath>
  </text>

  <!-- Curved Text (Bottom) -->
  <text fill="#FFFDD0" font-size="18" class="text-ring">
    <textPath href="#text-curve-bottom" startOffset="50%" text-anchor="middle" side="right">
       SERVING PHILADELPHIA 
    </textPath>
  </text>

  <!-- Central Content -->
  <g transform="translate(150, 150)">
    <!-- Icon: Stylized Wrench (Simple Geometric) -->
    <path d="M -25,-60 L -15,-70 C -5,-80 5,-80 15,-70 L 25,-60 L 15,-50 L 25,-40 L 15,-30 L 5,-40 L -5,-40 L -15,-30 L -25,-40 L -15,-50 L -25,-60 Z" fill="#E03E2F" />
    <!-- Handle -->
    <rect x="-8" y="-40" width="16" height="70" rx="4" fill="#E03E2F" />
    
    <!-- Brand Name -->
    <text x="0" y="55" text-anchor="middle" fill="#FFFDD0" font-size="48" class="brand-name">AUSTIN'S</text>
    <text x="0" y="80" text-anchor="middle" fill="#FFFDD0" font-size="14" font-family="sans-serif" font-weight="bold" letter-spacing="1">PLUMBING SERVICE LLC</text>
    
    <!-- EST Year -->
    <text x="0" y="0" text-anchor="middle" fill="#2A4B7C" font-size="12" font-weight="bold" dy="5">EST. 2017</text>
  </g>
</svg>
